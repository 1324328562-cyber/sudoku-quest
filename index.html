<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>数独百关 · 100 关渐进式数独闯关</title>
<meta name="description" content="100 关渐进式数独闯关游戏：10 个章节、难度逐级递进、笔记与提示、进度自动保存，纯前端离线可玩。">
<meta name="theme-color" content="#f7f5f0">
<meta property="og:title" content="数独百关 · Sudoku 100">
<meta property="og:description" content="100 关渐进式数独闯关，从入门庭院一路打到终焉天穹。">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231b2436'/%3E%3Cg fill='%23ffffff' fill-opacity='.85'%3E%3Crect x='7' y='7' width='4' height='4' rx='1'/%3E%3Crect x='14' y='7' width='4' height='4' rx='1'/%3E%3Crect x='21' y='14' width='4' height='4' rx='1'/%3E%3Crect x='7' y='21' width='4' height='4' rx='1'/%3E%3Crect x='14' y='21' width='4' height='4' rx='1'/%3E%3C/g%3E%3Crect x='21' y='21' width='4' height='4' rx='1' fill='%23e8603c'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="topbar">
  <a class="brand" href="./" aria-label="数独百关首页">
    <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
    <span class="brand-text">
      <strong>数独百关</strong>
      <span>Sudoku 100</span>
    </span>
  </a>
  <div class="topstats">
    <span>通关 <b id="statDone">0</b>/100</span>
    <span><span class="star-glyph">★</span> <b id="statStars">0</b>/300</span>
  </div>
</header>

<main>
  <!-- ===== 关卡地图 ===== -->
  <section id="view-hub" class="view">
    <div class="hero">
      <div>
        <h1>一百关，<em>一局一局</em>往上爬</h1>
        <p>10 个章节、100 道唯一解数独，给定数字从 45 个逐步减到 26 个。免登录、离线可玩，进度存在你自己的浏览器里。</p>
        <div class="hero-actions">
          <button class="btn" id="btnContinue" type="button">开始第 1 关</button>
          <button class="btn ghost" id="btnReset" type="button">重置进度</button>
        </div>
      </div>
      <div class="ring" id="progressRing" aria-hidden="true">
        <div class="ring-inner">
          <strong id="ringValue">0%</strong>
          <small>完成度</small>
        </div>
      </div>
    </div>

    <div class="chapters" id="chapters"></div>
  </section>

  <!-- ===== 游戏 ===== -->
  <section id="view-game" class="view hidden">
    <div class="game-shell">
      <div class="game-head">
        <button class="icon-btn" id="btnBack" type="button" title="返回关卡地图" aria-label="返回关卡地图">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <div class="game-title">
          <h1><span id="gameLevel">第 1 关</span><span class="chip" id="gameDiff">入门</span></h1>
          <p id="gameSub">起步庭院 · 45 个已知数</p>
        </div>
        <button class="timer" id="btnTimer" type="button" title="暂停 / 继续">00:00</button>
      </div>

      <div class="board-wrap">
        <div class="board" id="board" role="grid" aria-label="数独盘面"></div>
        <div class="pause-mask hidden" id="pauseMask">
          <div>
            <p>已暂停，计时停止</p>
            <button class="btn" id="btnResume" type="button">继续游戏</button>
          </div>
        </div>
        <div class="win hidden" id="winPanel"></div>
      </div>

      <div class="toolbar">
        <button class="tool" id="toolUndo" type="button" title="撤销 (Ctrl+Z)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h10a5 5 0 1 1 0 10H9"/><path d="M4 9l4-4M4 9l4 4"/></svg>
          <span>撤销</span>
        </button>
        <button class="tool" id="toolNote" type="button" title="笔记模式 (N)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
          <span>笔记</span>
        </button>
        <button class="tool" id="toolErase" type="button" title="擦除 (Backspace)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15.5 12.5 7a2 2 0 0 1 2.8 0l4.7 4.7a2 2 0 0 1 0 2.8L15 20H8.5L4 15.5Z"/><path d="M8 20h12"/></svg>
          <span>擦除</span>
        </button>
        <button class="tool" id="toolHint" type="button" title="提示 (H)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2Z"/></svg>
          <span>提示</span>
          <em class="badge" id="hintBadge">5</em>
        </button>
        <button class="tool" id="toolCheck" type="button" title="检查当前填写">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.1V12a10 10 0 1 1-5.9-9.1"/><path d="M22 4 12 14.01l-3-3"/></svg>
          <span>检查</span>
        </button>
      </div>

      <div class="numpad" id="numpad"></div>

      <div class="game-foot">
        <span id="footNote">点击格子后用数字键填入，支持键盘 1-9</span>
        <button class="linklike" id="btnRestart" type="button">重玩本关</button>
      </div>
    </div>
  </section>
</main>

<script src="assets/sudoku.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
